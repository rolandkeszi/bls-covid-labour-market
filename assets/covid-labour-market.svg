<svg xmlns="http://www.w3.org/2000/svg" width="860" height="850" viewBox="0 0 860 850" role="img" aria-labelledby="t d">
<title id="t">US labour market 2015–2026: the COVID-19 shock and recovery</title>
<desc id="d">Three panels from BLS data. Unemployment rate rose from 3.5% in February 2020 to 14.8% in April 2020 and fell back near 4% by May 2022. The employment–population ratio fell from 61.1% to 51.2%. Nonfarm payrolls fell by 21.9 million jobs between February and April 2020 and regained the pre-pandemic level in June 2022.</desc>
